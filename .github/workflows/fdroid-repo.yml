name: Publish F-Droid Repo

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build & Release Android App"]
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: fdroid-repo
  cancel-in-progress: false

jobs:
  publish-fdroid-repo:
    name: Build & Publish F-Droid Repository
    # Yalnızca manuel tetiklendiğinde veya sürüm workflow'u başarıyla bittiğinde çalış
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (fastlane metadata ve LICENSE için)
        uses: actions/checkout@v4
        with:
          path: main-repo
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fdroidserver
        run: |
          python -m pip install --upgrade pip
          pip install fdroidserver

          # Android SDK build-tools (apksigner) yolunu bul ve PATH'e ekle
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "${ANDROID_HOME}/build-tools" ]; then
            BT="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"
            echo "Build-tools: $BT"
            echo "$BT" >> "$GITHUB_PATH"
          else
            echo "::warning::ANDROID_HOME/build-tools bulunamadı, apksigner doğrulaması çalışmayabilir"
          fi

      - name: Validate secrets and decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] \vert{}\vert{} [ -z "$KEY_PASSWORD" ]; then
            echo "::error::KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD tanımlı değil"
            exit 1
          fi

          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

          ALIAS="${KEY_ALIAS:-upload}"
          echo "RESOLVED_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

          WORKDIR="${RUNNER_TEMP}/fdroid_workspace"
          mkdir -p "$WORKDIR"
          echo "FDROID_WORKDIR=$WORKDIR" >> "$GITHUB_ENV"

          # Keystore dosyasını geçici çalışma klasörüne çöz
          printf '%s' "$KEYSTORE_BASE64" \vert{} base64 -d > "$WORKDIR/keystore.jks"
          chmod 600 "$WORKDIR/keystore.jks"

          # Şifre ve alias doğru mu kontrol et (şifre komut satırına yazılmaz)
          if ! keytool -list -keystore "$WORKDIR/keystore.jks" -alias "$ALIAS" -storepass:env STORE_PASSWORD > /dev/null 2>&1; then
            echo "::error::Keystore açılamadı. KEYSTORE_BASE64, STORE_PASSWORD veya KEY_ALIAS yanlış olabilir"
            exit 1
          fi

          # Depo imza sertifikasının SHA-256 parmak izini hesapla (F-Droid formatı: küçük harf, iki noktasız)
          FP="$(LC_ALL=C keytool -list -v -keystore "$WORKDIR/keystore.jks" -alias "$ALIAS" -storepass:env STORE_PASSWORD | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')"
          if [ -z "$FP" ]; then
            echo "::error::Parmak izi hesaplanamadı"
            exit 1
          fi
          echo "REPO_FINGERPRINT=$FP" >> "$GITHUB_ENV"

      - name: Setup F-Droid workspace and config
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          REPO_NAME_ONLY="${GITHUB_REPOSITORY#*/}"
          REPO_OWNER="${GITHUB_REPOSITORY%/*}"
          REPO_URL="https://${REPO_OWNER}.github.io/${REPO_NAME_ONLY}/repo"
          echo "REPO_NAME_ONLY=$REPO_NAME_ONLY" >> "$GITHUB_ENV"
          echo "REPO_OWNER=$REPO_OWNER" >> "$GITHUB_ENV"
          echo "REPO_URL=$REPO_URL" >> "$GITHUB_ENV"

          mkdir -p "$FDROID_WORKDIR/fdroid/repo"
          mkdir -p "$FDROID_WORKDIR/fdroid/metadata"

          # config.yml: değerler JSON olarak yaz
          
