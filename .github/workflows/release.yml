name: Build & Release Android App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Sürüm numarası (örn. 1.2.0 veya 1.2.0-beta.1)'
        required: true
        type: string
      release_title:
        description: 'Sürüm başlığı ek açıklaması (isteğe bağlı)'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Ön sürüm (Pre-release) olarak işaretle'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Taslak (Draft) olarak oluştur'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine & Validate Version
        id: versioning
        run: |
          IS_RELEASE="false"
          RAW_VERSION=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IS_RELEASE="true"
            RAW_VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v*.*.* ]]; then
            IS_RELEASE="true"
            RAW_VERSION="${{ github.ref_name }}"
          fi

          if [ "$IS_RELEASE" = "true" ]; then
            # Sürüm formatını doğrula: ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$REGEX='^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
            if [[ ! "$RAW_VERSION" =~ $REGEX ]]; then
              echo "::error::Geçersiz sürüm biçimi: '$RAW_VERSION'. Beklenen biçim: 1.2.0, v1.2.0 veya 1.2.0-beta.1"
              exit 1
            fi

            # 'v' önekini temizle
            CLEAN_VERSION="${RAW_VERSION#v}"
            TAG_NAME="v${CLEAN_VERSION}"

            # Eğer workflow_dispatch ile tetiklendiyse ve tag uzak depoda zaten varsa hata ver
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              if git rev-parse "$TAG_NAME" >/dev/null 2>&1 || (git ls-remote --tags origin "refs/tags/$TAG_NAME" | grep -q "$TAG_NAME"); then
                echo "::error::'$TAG_NAME' etiketi depoda zaten mevcut! Lütfen yeni bir sürüm numarası belirleyin."
                exit 1
              fi
            fi

            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "clean_version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"
            echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "clean_version=1.0.0" >> "$GITHUB_OUTPUT"
            echo "tag_name=ci-build" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Release imzalama secret'ları tanımlı değil (KEYSTORE_BASE64 eksik)!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" \vert{} base64 -d > "${{ github.workspace }}/release.keystore"

      - name: Build Release APK and AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
        run: |
          if [ -z "$STORE_PASSWORD" ] \vert{}\vert{} [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release imzalama secret'ları tanımlı değil (STORE_PASSWORD veya KEY_PASSWORD eksik)!"
            exit 1
          fi

          ./gradlew assembleRelease bundleRelease --no-daemon \
            -PappVersionName="${{ steps.versioning.outputs.clean_version }}" \
            -PappVersionCode="${{ github.run_number }}"

      - name: Package Artifacts
        id: package_artifacts
        run: |
          mkdir -p dist
          CLEAN_VER="${{ steps.versioning.outputs.clean_version }}"
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB_SRC=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)

          if [ ! -f "$APK_SRC" ] \vert{}\vert{} [ ! -f "$AAB_SRC" ]; then
            echo "::error::APK veya AAB derleme çıktısı bulunamadı!"
            exit 1
          fi

          APK_NAME="Solitaire-v${CLEAN_VER}.apk"
          AAB_NAME="Solitaire-v${CLEAN_VER}.aab"

          cp "$APK_SRC" "dist/${APK_NAME}"
          cp "$AAB_SRC" "dist/${AAB_NAME}"

          cd dist
          sha256sum "$APK_NAME" > "${APK_NAME}.sha256"
          sha256sum "$AAB_NAME" > "${AAB_NAME}.sha256"
          APK_SHA256=$(cat "${APK_NAME}.sha256" | awk '{print $1}')
          cd ..

          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "aab_name=$AAB_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload Workflow Artifacts (14 Days)
        uses: actions/upload-artifact@v4
        with:
          name: Solitaire-Artifacts-${{ steps.versioning.outputs.clean_version }}
          path: dist/*
          retention-days: 14

      - name: Publish GitHub Release
        if: steps.versioning.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: ${{ inputs.release_title != '' && format('Solitaire v{0} — {1}', steps.versioning.outputs.clean_version, inputs.release_title) || format('Solitaire v{0}', steps.versioning.outputs.clean_version) }}
          files: |
            dist/${{ steps.package_artifacts.outputs.apk_name }}
            dist/${{ steps.package_artifacts.outputs.apk_name }}.sha256
            dist/${{ steps.package_artifacts.outputs.aab_name }}
            dist/${{ steps.package_artifacts.outputs.aab_name }}.sha256
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          body: |
            ### Solitaire Android Sürümü (v${{ steps.versioning.outputs.clean_version }})

            #### Kurulum Notu
            APK'yı indirip cihazınıza kurabilirsiniz. Google Play Protect "tanınmayan geliştirici" uyarısı verirse **Diğer ayrıntılar → Yine de yükle** seçeneğini kullanın.

            #### Doğrulama (SHA-256)
            - **${{ steps.package_artifacts.outputs.apk_name }}**:
              `${{ steps.package_artifacts.outputs.apk_sha256 }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

