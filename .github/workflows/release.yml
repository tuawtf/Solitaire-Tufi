name: Build & Release Android App

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: ''
      release_title:
        description: 'Release Title'
        required: false
        default: ''
      is_draft:
        description: 'Publish as Draft'
        type: boolean
        default: false
      is_prerelease:
        description: 'Publish as Pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Release APK & Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "Setting up release keystore..."
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding keystore from GitHub Secret (KEYSTORE_BASE64)..."
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          elif [ -f "my-upload-key.base64" ]; then
            echo "Decoding keystore from my-upload-key.base64 in repository..."
            base64 -d my-upload-key.base64 > my-upload-key.jks
          elif [ ! -f "my-upload-key.jks" ]; then
            echo "Generating fallback release keystore on the fly..."
            keytool -genkeypair -v -keystore my-upload-key.jks \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "solitaire_release_pass" -keypass "solitaire_release_pass" \
              -dname "CN=Solitaire, OU=Android, O=SolitaireApp, L=Istanbul, S=TR, C=TR"
          else
            echo "Found existing my-upload-key.jks file."
          fi

      - name: Build Release APK and AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'solitaire_release_pass' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'solitaire_release_pass' }}
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          mkdir -p release-output
          TAG="${{ github.ref_name }}"
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "$TAG" != v* ]]; then
            TAG="v1.0.0-build.${{ github.run_number }}"
          fi
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

          # Copy APK and AAB with clean names
          cp app/build/outputs/apk/release/*.apk "release-output/Solitaire-${TAG}.apk"
          cp app/build/outputs/bundle/release/*.aab "release-output/Solitaire-${TAG}.aab"
          echo "Artifacts prepared in release-output:"
          ls -la release-output/

      - name: Upload Build Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: Solitaire-Release-Binaries
          path: release-output/*
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ steps.prepare_artifacts.outputs.tag_name }}
          name: ${{ inputs.release_title || steps.prepare_artifacts.outputs.tag_name }}
          files: |
            release-output/*.apk
            release-output/*.aab
          draft: ${{ inputs.is_draft || false }}
          prerelease: ${{ inputs.is_prerelease || false }}
          generate_release_notes: true
          body: |
            ### Solitaire Android Release (${{ steps.prepare_artifacts.outputs.tag_name }})
            
            - **APK (Direkt Cihaza Yükleme)**: `Solitaire-${{ steps.prepare_artifacts.outputs.tag_name }}.apk`
            - **AAB (Google Play / App Bundle)**: `Solitaire-${{ steps.prepare_artifacts.outputs.tag_name }}.aab`
            
            Otomatik olarak GitHub Actions tarafından imzalanıp derlendi.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
